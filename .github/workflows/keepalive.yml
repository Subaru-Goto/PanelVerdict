# The LOUD half of the health story. cron-job.org pings /health every 12 minutes to
# keep Render warm and Supabase off its 7-day idle pause (decided on #154, amended in
# deploy-targets.md) — but its failure alerts are email. This daily run FAILS RED in
# the repo unless the database answers, which is the signal that is hard to miss; it
# also stands in as the keep-alive of last resort if cron-job.org ever stops.
#
# DEPLOY_HEALTH_URL is a repository *secret* (Settings → Secrets and variables →
# Actions → Secrets), e.g. https://<service>.onrender.com — no trailing slash.
# A secret and not a variable (088): this repo is public, so run logs are public,
# and curl names the host in its failure messages — exactly when this loud check
# goes red. Secrets are masked in logs; variables are not. The URL is guessable
# anyway (the service name derives it), but the repo should not print it.
# Until it is set, runs skip quietly instead of failing: the workflow lands with the
# code, the deploy lands later.
name: keepalive

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC — an off-minute, kind to the shared cron pool
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health and require the database to answer
        env:
          URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "DEPLOY_HEALTH_URL not set — nothing deployed yet, skipping."
            exit 0
          fi
          # Masking replaces only the exact secret value, and curl's failure
          # messages name the *bare host* — a substring the mask misses, on
          # exactly the red-run paths (DNS, connect, connect-timeout) this
          # secret exists for. Mask the derived host before any byte that
          # could print it.
          host="${URL#*://}"; host="${host%%/*}"
          echo "::add-mask::$host"
          # --max-time 120: if this run is doing its last-resort job, the Render free
          # instance has spun down and needs ~1 minute to wake before it can answer.
          body=$(curl -fsS --max-time 120 "$URL/health")
          # The body never prints: run logs are public and the response is
          # remote content — a compromised or misbehaving endpoint could put
          # anything there, including ::workflow commands:: the runner would
          # obey. Fixed sentences only; an operator who needs the body can
          # curl /health themselves.
          # "db":"up" is the half that keeps Supabase awake; a paused or broken
          # database must FAIL this job so it is noticed, not merely logged.
          if ! printf '%s' "$body" | grep -q '"db":"up"'; then
            echo "health answered, but the database did not report up — check Supabase"
            exit 1
          fi
          # "auth":"on" is the other half: sign-in silently unenforced is the
          # failure /health exists to make visible (see its docstring), and a
          # deployment that boots with SUPABASE_PROJECT_URL missing would
          # otherwise look healthy from here.
          if ! printf '%s' "$body" | grep -q '"auth":"on"'; then
            echo "health answered, but sign-in is not being enforced — check SUPABASE_PROJECT_URL"
            exit 1
          fi
          echo "health ok — database up, sign-in enforced"
