# The LOUD half of the health story. cron-job.org pings /health every 12 minutes to
# keep Render warm and Supabase off its 7-day idle pause (decided on #154, amended in
# deploy-targets.md) — but its failure alerts are email. This daily run FAILS RED in
# the repo unless the database answers, which is the signal that is hard to miss; it
# also stands in as the keep-alive of last resort if cron-job.org ever stops.
#
# DEPLOY_HEALTH_URL is a repository *variable* (Settings → Secrets and variables →
# Actions → Variables), e.g. https://<service>.onrender.com — no trailing slash.
# Until it is set, runs skip quietly instead of failing: the workflow lands with the
# code, the deploy lands later.
name: keepalive

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC — an off-minute, kind to the shared cron pool
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health and require the database to answer
        env:
          URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "DEPLOY_HEALTH_URL not set — nothing deployed yet, skipping."
            exit 0
          fi
          # --max-time 120: if this run is doing its last-resort job, the Render free
          # instance has spun down and needs ~1 minute to wake before it can answer.
          body=$(curl -fsS --max-time 120 "$URL/health")
          echo "$body"
          # "db":"up" is the half that keeps Supabase awake; a paused or broken
          # database must FAIL this job so it is noticed, not merely logged.
          echo "$body" | grep -q '"db":"up"'
