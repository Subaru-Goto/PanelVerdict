[project]
name = "panelverdict-backend"
version = "0.1.0"
description = "PanelVerdict backend — FastAPI API + (later) LangGraph orchestrator and panel pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "langchain-openai>=1.3.5",
    "numpy>=2.5.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
]

[tool.uv]
package = false
# pipeline is offline-only at runtime, but its tests import pandas — include it
# by default so `uv run pytest` works without a group flag.
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "testcontainers[postgres]>=4.14.2",
]
pipeline = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
]
