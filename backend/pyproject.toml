[project]
name = "panelverdict-backend"
version = "0.1.0"
description = "PanelVerdict backend — FastAPI API + (later) the orchestrator and panel pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The app imports it directly since 113/#243: the CancelScope shields that
    # let the chat stream's shutdown finish while Starlette's task group is
    # cancelling it. Also the pytest plugin the async suite runs on (107 tests,
    # `pytest --collect-only -m anyio`, 2026-08-27) — it always arrived
    # transitively via starlette, but a runtime import deserves a declared edge.
    "anyio>=4.14.2",
    "fastapi[standard]>=0.139.2",
    "langchain>=1.3.14",
    # Required at runtime even though no app module imports it any more:
    # `init_chat_model`/`init_embeddings` resolve `model_provider` to this
    # package and import it themselves. Dropping it as "unused" would leave the
    # app importable and every model call broken.
    "langchain-openai>=1.3.5",
    "langgraph-checkpoint-postgres>=3.1.2",
    "numpy>=2.5.1",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "scipy>=1.16.3",
]

[tool.uv]
package = false
# pipeline is offline-only at runtime, but its tests import pandas — include it
# by default so `uv run pytest` works without a group flag.
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# 103/#221: mypy at its default strictness over the deployed code and its
# tests. `check_untyped_defs` is what makes the tests count — their functions
# are unannotated, and a test double that drifts from a Protocol is only seen
# inside one. `warn_unused_ignores` expires an ignore when a library fixes itself.
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.pydantic-mypy]
# Off, the plugin types every model constructor argument as Any and a wrong
# type is only caught when pydantic validates it at run time.
init_typed = true

[[tool.mypy.overrides]]
# Ship no stubs and no py.typed marker.
module = ["pandas.*", "scipy.*", "testcontainers.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# On-demand research code, imported by a few tests: checked for the caller's
# sake, its own errors not reported.
module = ["experiments.*", "pipeline.*"]
follow_imports = "silent"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "testcontainers[postgres]>=4.14.2",
]
pipeline = [
    "pandas>=2.2.0",
]
